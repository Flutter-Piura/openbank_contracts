name: Contract quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2
      - name: Install dependencies
        run: npm ci
      - name: Lint, bundle and generate Dart client
        run: npm test
      - name: Verify generated Dart package
        working-directory: generated/dart
        run: |
          dart pub get
          dart run build_runner build
          # OpenAPI Generator currently emits harmless unused imports. Keep
          # analyzer errors fatal while reporting generated-code warnings.
          dart analyze --no-fatal-warnings
          dart test

  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect base contract
        id: base-contract
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:openapi/openapi.yaml" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject breaking changes
        if: steps.base-contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14
        with:
          base: origin/${{ github.base_ref }}:openapi/openapi.yaml
          revision: HEAD:openapi/openapi.yaml
          fail-on: ERR
          review: false
